name: CI

# Temporarily disabled: GitHub Actions billing/spending limit blocks runs
# (jobs fail before steps start). Re-enable push/pull_request triggers when
# org billing is fixed.
#
# Previous triggers:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Corbits Code codebase only — ./src and ./tests. The vendored interchange
      # inference package (vendor/) is out of scope for this repo's CI.
      - name: Test
        run: bun run test
